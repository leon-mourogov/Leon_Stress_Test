# settings_demo.yaml — configuration de la démo en ligne : données synthétiques versionnées dans demo/
# Les chemins relatifs sont interprétés depuis le dossier de CE fichier.

paths:
  book: book.json
  scenarios: scenarios.json
  limits: limits.json
  prices:                       # un ou plusieurs fichiers CSV ou Excel (format détecté automatiquement)
    - ../demo/fx.csv
    - ../demo/spx.csv
  reports: ../demo/reports
  logs: ../demo/logs

database:
  url: sqlite:///../demo/quantlab_demo.db

risk:
  base_currency: EUR
  var_window_days: 500
  var_level: 0.99
  es_level: 0.975
  mc_paths_var: 10000          # Monte Carlo allégé pour les 500 revalorisations de la VaR
  factor_series:               # facteur sans historique propre -> série utilisée comme proxy
    SX5E: SPX

market:                         # instantané de marché du jour (en production : chargé depuis la base)
  spots: {SX5E: 4900.0, EURUSD: 1.17}
  vols: {SX5E: 0.18, EURUSD: 0.07}
  rates: {EUR: 0.02, USD: 0.04}
  div_yields: {SX5E: 0.03}

alerts:
  enabled: false
  smtp_host: smtp.example.com
  smtp_port: 587
  sender: quantlab@example.com
  recipients: [leon@example.com]
  # le mot de passe n'est JAMAIS ici : variable d'environnement QUANTLAB_SMTP_PASSWORD
